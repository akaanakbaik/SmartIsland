// Export resolved Maven components without changing application dependencies.
import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.register("auditDependencyInventory") {
        doLast {
            def modules = new TreeMap<String, Map>()
            def collect = { configuration ->
                if (!configuration.canBeResolved) {
                    throw new GradleException("Cannot resolve ${configuration.name}")
                }
                // Force failure on unresolved artifacts instead of emitting a partial inventory.
                configuration.resolve()
                configuration.incoming.resolutionResult.allComponents.each { component ->
                    if (component.id instanceof ModuleComponentIdentifier) {
                        def id = component.id
                        modules["${id.group}:${id.module}:${id.version}"] = [
                            package: [name: "${id.group}:${id.module}", ecosystem: "Maven"],
                            version: id.version,
                        ]
                    }
                }
            }
            root.allprojects.each { project ->
                collect(project.buildscript.configurations.getByName("classpath"))
            }
            [":app": ["debugRuntimeClasspath", "releaseRuntimeClasspath",
                      "debugUnitTestRuntimeClasspath", "debugAndroidTestRuntimeClasspath"],
             ":baselineprofile": ["benchmarkReleaseRuntimeClasspath"]].each { path, names ->
                def project = root.project(path)
                names.each { name -> collect(project.configurations.getByName(name)) }
            }
            if (modules.isEmpty()) {
                throw new GradleException("No resolved Maven components found")
            }
            def output = new File(root.layout.buildDirectory.get().asFile, "reports/audit/dependencies.json")
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([queries: modules.values()]))
            logger.lifecycle("Exported ${modules.size()} resolved Maven components to ${output}")
        }
    }
}
