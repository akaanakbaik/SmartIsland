name: Baseline profile

# Started by hand: Actions tab > Baseline profile > Run workflow.
# Generates app/src/main/baseline-prof.txt on an emulator and uploads it as an artifact.
# Tick "commit" to have the workflow commit the file to the branch it ran on.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit baseline-prof.txt to this branch'
        type: boolean
        default: false

concurrency:
  group: baseline-profile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    name: Generate on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The Pixel 6 emulator wants about 7.4 GB for its data partition and the runner had 7.2 GB free.
      # Delete toolchains this job never uses (they are not needed for Android builds).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept all SDK licenses
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          exit 0
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: chmod +x ./gradlew
      # The emulator needs hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generate baseline profile
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-metrics -no-boot-anim -camera-back none -camera-front none
          script: ./gradlew :app:generateBaselineProfile --stacktrace
      - name: Locate the profile
        if: always()
        run: |
          echo "Profile files under app/src:"
          find app/src -name 'baseline-prof.txt' -exec wc -l {} \; || true
          echo "Generated folders:"
          find app/src -type d -name generated || true
      - name: Upload baseline profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baseline-prof
          path: app/src/**/baseline-prof.txt
          if-no-files-found: warn
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baselineprofile-reports
          path: |
            baselineprofile/build/reports
            baselineprofile/build/outputs
          if-no-files-found: ignore
      - name: Commit baseline-prof.txt
        if: inputs.commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -n "$(find app/src -name baseline-prof.txt)" || { echo "No baseline-prof.txt was generated"; exit 1; }
          git add -f $(find app/src -name baseline-prof.txt)
          git diff --cached --quiet || git commit -m "Add generated baseline profile"
          git push
